    <!-- Loop Arrow 3 (Left) -->
    <path d="M12 36 C6 30 6 18 15 10 L12 7 M15 10 L18 14" stroke="url(#koleGreenGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Leaf Sprout -->
    <path d="M24 30 C24 20 33 16 33 16 C33 16 28 26 24 30 Z" fill="#22c55e" />
    <path d="M24 30 C24 22 17 19 17 19 C17 19 21 27 24 30 Z" fill="#16a34a" />
